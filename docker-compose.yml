services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fluxa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fluxa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: fluxa-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_MODE: api
      HTTP_ADDR: 0.0.0.0:8080
      GRPC_ADDR: 0.0.0.0:50051
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fluxa
      REDIS_URL: redis://redis/
      JWT_SECRET: local-development-secret-local-development
      GRPC_AUTH_TOKEN: local-development-grpc-token-local-development
      CORS_ALLOW_ORIGIN: "*"
      MAILER_PROVIDER: ${MAILER_PROVIDER:-log}
      ARTIFACT_STORAGE_DIR: /var/lib/fluxa/exports
      MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-5242880}
    volumes:
      - exports-data:/var/lib/fluxa/exports
    ports:
      - "${HTTP_HOST_PORT:-18080}:8080"
      # gRPC carries internal admin APIs; bind to loopback only by default.
      # Override GRPC_HOST_BIND to expose it beyond the local machine.
      - "${GRPC_HOST_BIND:-127.0.0.1}:${GRPC_HOST_PORT:-15051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: fluxa-backend:local
    command: ["fluxa-backend", "--mode", "worker"]
    restart: unless-stopped
    environment:
      APP_MODE: worker
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/fluxa
      REDIS_URL: redis://redis/
      JWT_SECRET: local-development-secret-local-development
      GRPC_AUTH_TOKEN: local-development-grpc-token-local-development
      MAILER_PROVIDER: ${MAILER_PROVIDER:-log}
      ARTIFACT_STORAGE_DIR: /var/lib/fluxa/exports
      MAX_ATTACHMENT_SIZE_BYTES: ${MAX_ATTACHMENT_SIZE_BYTES:-5242880}
    volumes:
      - exports-data:/var/lib/fluxa/exports
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  exports-data:
