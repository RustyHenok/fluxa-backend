name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install smoke test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Audit dependencies for advisories
        run: cargo audit

      - name: Generate OpenAPI spec
        run: ./scripts/generate_openapi.sh

      - name: Verify OpenAPI spec is up to date
        run: git diff --exit-code -- openapi/fluxa-openapi.json

      - name: Run unit tests
        run: cargo test

      - name: Start local stack
        run: docker compose up --build -d

      - name: Wait for migrations and readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/readyz | grep -q '"ready"'; then
              echo "stack ready (migrations applied)"
              exit 0
            fi
            sleep 2
          done
          echo "stack did not become ready; migrations may have failed" >&2
          docker compose logs --no-color api
          exit 1

      - name: Run Docker-backed integration tests
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/fluxa
          TEST_REDIS_URL: redis://127.0.0.1:16379/
        run: cargo test --test stack_contracts -- --ignored --nocapture

      - name: Run end-to-end smoke test
        env:
          BASE: http://127.0.0.1:18080
          SMOKE_MAX_WAIT_SECONDS: 90
        run: ./scripts/smoke_test.sh

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color api worker postgres redis

      - name: Tear down stack
        if: always()
        run: docker compose down -v --remove-orphans

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fluxa-backend:scan .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: fluxa-backend:scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
